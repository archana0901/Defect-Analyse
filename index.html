
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AA Defect Insight & Feedback Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ================= GLOBAL ================= */
body{
     margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at top left,#c7d2fe,transparent 40%),
        radial-gradient(circle at bottom right,#99f6e4,transparent 40%),
        linear-gradient(180deg,#eef2ff,#f8fafc);
    min-height:100vh;
    padding:30px;
    color:#0f172a;

}

/* ================= HERO ================= */
.hero{
    padding:30px 20px 80px;
    text-align:center;
}
.hero h1{
    font-size:36px;
    font-weight:800;
    color:#0f172a;
}


/* ================= FLOATING CONTROLS ================= */
.control-strip{
    margin:-60px auto 50px;
    max-width:1400px;
    background:rgba(255,255,255,.65);
    backdrop-filter:blur(14px);
    border-radius:20px;
    padding:25px 30px;
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
}

/* ================= FILE UPLOAD ================= */
.hidden-file{display:none;}
.file-btn{
    padding:16px 36px;
    border-radius:999px;
    color:#fff;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    background:linear-gradient(135deg,#6366f1,#22d3ee);
    box-shadow:0 12px 30px rgba(99,102,241,.4);
}
.file-btn:hover{transform:translateY(-2px);}
.file-name{font-size:13px;color:#475569;margin-top:6px}

/* ================= DROPDOWNS ================= */
.dropdown{position:relative;}
.dropdown-btn{
    padding:14px 22px;
    border-radius:999px;
    border:1px solid #cbd5f5;
    background:#fff;
    cursor:pointer;
    min-width:220px;
}
.dropdown-content{
    display:none;
    position:absolute;
    top:120%;
    left:0;
    background:#fff;
    border-radius:16px;
    padding:12px;
    max-height:220px;
    overflow-y:auto;
    width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    z-index:10;
}
.dropdown-content label{
    display:block;
    margin-bottom:6px;
    cursor:pointer;
    font-size:13px;
}

/* ================= MAIN CONTENT ================= */
.container{
    max-width:1500px;
    margin:auto;
    padding:0 20px 80px;
overflow-x: hidden;
}

/* ================= CHARTS ================= */
.charts{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:40px;
background:#fff;
    border-radius:20px;
    padding:20px 22px;
    box-shadow:0 12px 28px rgba(0,0,0,.12);

}
@media(max-width:900px){
    .charts{grid-template-columns:1fr;}
}

/* ================= FEEDBACK ================= */
.feedback{
    font-size:15px;
    line-height:1.8;
    color:#0f172a;
background:#fff;
    border-radius:20px;
    padding:20px 22px;
    box-shadow:0 12px 28px rgba(0,0,0,.12);

}

/* ================= CHIPS ================= */
.selected-chip{
    background:#eef2ff;
    border:1px solid #c7d2fe;
    padding:4px 10px;
    border-radius:14px;
    font-size:12px;
    color:#4338ca;
}

/* ================= ATTRIBUTE BLOCK ================= */
.attr-block{
    border-left:4px solid #6366f1;
    padding-left:16px;
    margin-top:18px;
}
.attr-header{
    font-weight:700;
    color:#1e293b;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
}
.attr-body{
    display:none;
    margin-top:10px;
}

/* ================= IMAGE LINKS ================= */
.image-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:6px;
}
.image-row a{
    padding:6px 12px;
    border-radius:999px;
    background:#eef2ff;
    font-size:12px;
    text-decoration:none;
    color:#4338ca;
}

/* ================= AA BADGE ================= */
.aa-login{
    background:#22c55e;
    color:#fff;
    padding:3px 8px;
    border-radius:12px;
    font-size:11px;
    font-weight:600;
}

/* ================= ACTION BUTTONS ================= */
.bubble-btn{
    margin-top:30px;
    padding:14px 36px;
    border-radius:999px;
    border:none;
    font-weight:700;
    font-size:14px;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(135deg,#f97316,#ec4899);
}

/* ================= FLOATING NAV ================= */
.corner-action-btn{
    position:fixed;
    top:26px;
    right:28px;
    padding:10px 20px;
    border-radius:999px;
    background:linear-gradient(135deg,#8b5cf6,#6366f1);
    color:#fff;
    font-weight:700;
    font-size:13px;
    border:none;
    cursor:pointer;
    box-shadow:0 16px 36px rgba(99,102,241,.45);
}
.aa-table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}
.aa-table th,
.aa-table td{
    padding:12px 14px;
    border-bottom:1px solid #eee;
    font-size:14px;
}
.aa-table th{
    background:#185a9d;
    color:#fff;
}

.feedback,
.attr-body,
.asin-list li{
    max-width: 100%;
    word-break: break-word;
    overflow-wrap: anywhere;
}
.image-row{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 100%;
}
.image-row a{
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.image-row *{list-style:none!important;}

.feedback{
    background:linear-gradient(135deg,#f8fbff,#eef4ff);
    padding:26px;
    border-radius:18px;
    line-height:1.8;
    font-size:15px;
    word-break:break-word;
    overflow-wrap:anywhere;
}
.analysis-grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:30px;
}
.charts-column{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.section-title{
    margin:25px 0 10px;
    font-weight:700;
    font-size:16px;
    color:#333;
}

</style>
</head>

<body>

<button class="corner-action-btn" onclick="goToDetailsPage()">➜ All Defects</button>

<div class="hero">
    <h1>AA Defect Insight & Feedback Dashboard</h1>
    
</div>

<div class="control-strip">
    <div>
        <label class="file-btn" for="upload">Choose Excel File</label>
        <input id="upload" type="file" accept=".xlsx,.xls" class="hidden-file">
        <div id="fileName" class="file-name">No file selected</div>
    </div>

    <div class="dropdown" id="managerBox" style="display:none">
        <div class="dropdown-btn" id="managerBtn">Select Manager</div>
        <div class="dropdown-content" id="managerList"></div>
    </div>

    <div class="dropdown" id="dropdownBox" style="display:none">
        <div class="dropdown-btn" id="dropdownBtn">Select Associates</div>
        <div class="dropdown-content" id="associateList"></div>
    </div>

    <div class="dropdown" id="dateBox" style="display:none">
        <div class="dropdown-btn" id="dateBtn">Select Dates</div>
        <div class="dropdown-content" id="dateList"></div>
    </div>
<div class="dropdown" id="packageBox" style="display:none">
    <div class="dropdown-btn" id="packageBtn">Select Package Type</div>
    <div class="dropdown-content" id="packageList"></div>
</div>

</div>

<div class="container" id="chartSection" style="display:none">
    <div class="charts">
        <div>
            <canvas id="missedChart"></canvas>
            <canvas id="dateChart"></canvas>
<div id="aaTableContainer"></div>
        </div>
        <div class="feedback" id="feedbackText"></div>
    </div>
 <div class="section-title">Top 3 Repeated Defect Categories</div>
    <div class="feedback" id="topCategories"></div>

    <button class="bubble-btn" onclick="sendMail()">Share Feedback</button>
    <button class="bubble-btn" onclick="downloadCSV()">⬇ Download Top Defects</button>
</div>


<script>
let data=[], missedChart, dateChart;
let aaExpanded=false;
let exportTopAttributeData = [];
const MAX_IMAGES = 10; // adjust if needed
const COL_MANAGER="Manager";
const COL_AA="Associate 1";
const COL_INCORRECT="Incorrect";
const COL_DATE="Job Review Date";
const COL_PACKAGE = "Package Type";   
const COL_CATEGORY="Auditor Reason Code";
const COL_ASIN="ASIN";
const COL_RETAIL="Retail Page URL";
const COL_HTML="HTML CODE";

/* Helpers */
function parseExcelDate(v){
    if(!v) return null;
    if(typeof v==="number") return new Date((v-25569)*86400*1000);
    const d=new Date(v); return isNaN(d)?null:d;
}
function formatDate(d){return d.toISOString().split("T")[0];}
function extractImageUrlsFromHtml(h){
    if(!h) return [];
    const tags=h.toString().match(/<img[^>]+src=["']([^"']+)["']/gi);
    return tags?tags.map(t=>t.match(/src=["']([^"']+)["']/i)[1]):[];
}

/* Dropdown helpers */
function handleAllToggle(box){
    const all=box.querySelector('input[value="ALL"]');
    [...box.querySelectorAll('input:not([value="ALL"])')].forEach(o=>o.checked=all.checked);
}
function syncAllFromChildren(box){
    const all=box.querySelector('input[value="ALL"]');
    const others=[...box.querySelectorAll('input:not([value="ALL"])')];
    all.checked=others.length && others.every(o=>o.checked);
}
function getSelected(box){
    return [...box.querySelectorAll('input:checked')].map(i=>i.value).filter(v=>v!=="ALL");
}
function updateText(btn,box,label){
    const c=getSelected(box).length;
    btn.innerText=c?`${c} Selected`:`Select ${label}`;
}

/* Upload */
upload.onchange=e=>{
    fileName.innerText=e.target.files[0]?.name||"No file selected";
    const r=new FileReader();
    r.onload=ev=>{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        loadManagers(); loadAssociates(); loadDates(); loadPackages();
    };
    r.readAsArrayBuffer(e.target.files[0]);
};

/* Managers */
function loadManagers(){
    managerBox.style.display="block";
    managerList.innerHTML=`<label><input type="checkbox" value="ALL"> <b>All Managers</b></label>`;
    [...new Set(data.map(d=>d[COL_MANAGER]).filter(Boolean))].forEach(m=>{
        managerList.innerHTML+=`<label><input type="checkbox" value="${m}"> ${m}</label>`;
    });
    managerList.querySelectorAll("input").forEach(cb=>{
        cb.onchange=e=>{
            e.target.value==="ALL"?handleAllToggle(managerList):syncAllFromChildren(managerList);
            updateText(managerBtn,managerList,"Manager");
            loadAssociates(); analyse();
        };
    });
}

/* Associates */
function loadAssociates(){

    dropdownBox.style.display="block";

    associateList.innerHTML = `
        <label>
            <input type="checkbox" value="ALL">
            <b>All Associates</b>
        </label>
    `;

    const mgrs = getSelected(managerList);
    const packages = getSelected(packageList);

    const filtered = data.filter(d => {

        // Manager filter
        if(mgrs.length && !mgrs.includes(d[COL_MANAGER]))
            return false;

        // Package Type filter
        if(packages.length && !packages.includes(d[COL_PACKAGE]))
            return false;

        return true;
    });

    const uniqueAssociates = [
        ...new Set(filtered.map(d => d[COL_AA]).filter(Boolean))
    ];

    uniqueAssociates.forEach(a=>{
        associateList.innerHTML += `
            <label>
                <input type="checkbox" value="${a}">
                ${a}
            </label>
        `;
    });

    associateList.querySelectorAll("input").forEach(cb=>{
        cb.onchange = e=>{
            e.target.value==="ALL"
                ? handleAllToggle(associateList)
                : syncAllFromChildren(associateList);

            updateText(dropdownBtn,associateList,"Associates");
            aaExpanded=false;
            analyse();
        };
    });
}


/* Dates */
function loadDates(){
    dateBox.style.display="block";
    dateList.innerHTML=`<label><input type="checkbox" value="ALL"> <b>All Dates</b></label>`;
    [...new Set(data.map(d=>parseExcelDate(d[COL_DATE])).filter(Boolean).map(formatDate))].sort()
        .forEach(dt=>{
            dateList.innerHTML+=`<label><input type="checkbox" value="${dt}"> ${dt}</label>`;
        });
    dateList.querySelectorAll("input").forEach(cb=>{
        cb.onchange=e=>{
            e.target.value==="ALL"?handleAllToggle(dateList):syncAllFromChildren(dateList);
            updateText(dateBtn,dateList,"Dates");
            analyse();
        };
    });
}

function loadPackages(){
    packageBox.style.display = "block";

    packageList.innerHTML = `
        <label>
            <input type="checkbox" value="ALL">
            <b>All Package Types</b>
        </label>
    `;

    const uniquePackages = [
        ...new Set(data.map(d => d[COL_PACKAGE]).filter(Boolean))
    ];

    uniquePackages.forEach(p => {
        packageList.innerHTML += `
            <label>
                <input type="checkbox" value="${p}">
                ${p}
            </label>
        `;
    });

    packageList.querySelectorAll("input").forEach(cb => {
        cb.onchange = e => {
            e.target.value === "ALL"
                ? handleAllToggle(packageList)
                : syncAllFromChildren(packageList);

            updateText(packageBtn, packageList, "Package Type");
loadAssociates();
            analyse();
        };
    });
}

/* Toggle selected AAs */
function toggleMoreAAs(){
    aaExpanded=!aaExpanded;
    analyse();
}

/* Analyse */
function analyse(){
    const aas=getSelected(associateList);
    const dates=getSelected(dateList);
const packages = getSelected(packageList);

    if(!aas.length) return;

    const rows = data.filter(d => {

    if(!aas.includes(d[COL_AA])) return false;

    if(packages.length && !packages.includes(d[COL_PACKAGE])) return false;

    if(dates.length){
        const dt=parseExcelDate(d[COL_DATE]);
        if(!dt || !dates.includes(formatDate(dt))) return false;
    }

    return true;
});


latestRows = rows;
    chartSection.style.display="block";

    let attrMap={}, asinMap={}, dateCount={}, catCount={};

    rows.forEach(r=>{
        if(r[COL_INCORRECT]){
            r[COL_INCORRECT].split(",").forEach(a=>{
                a=a.trim();
                attrMap[a]=(attrMap[a]||0)+1;
                asinMap[a]=asinMap[a]||[];
                asinMap[a].push({
                    asin:r[COL_ASIN],
                    retail:r[COL_RETAIL],
                    aa: r[COL_AA], 
                    reason:r[COL_CATEGORY],
                    images:extractImageUrlsFromHtml(r[COL_HTML])
                });
            });
        }
        if(r[COL_CATEGORY]) catCount[r[COL_CATEGORY]]=(catCount[r[COL_CATEGORY]]||0)+1;
        const d=parseExcelDate(r[COL_DATE]);
        if(d){const k=formatDate(d);dateCount[k]=(dateCount[k]||0)+1;}
    });

    const topMissed=Object.entries(attrMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
exportTopAttributeData = [];

topMissed.forEach(attr => {
    const attrName = attr[0];

    (asinMap[attrName] || []).forEach(o => {
        exportTopAttributeData.push({
            attribute: attrName,
            asin: o.asin,
            aa: o.aa,
            reason: o.reason,
            retail: o.retail,
            images: o.images   
        });
    });
});


    /* Selected Associates UI */
    const aaHtml = aaExpanded || aas.length<=3
        ? aas.map(a=>`<span class="selected-chip">${a}</span>`).join("")
        : aas.slice(0,3).map(a=>`<span class="selected-chip">${a}</span>`).join("")
          + `<span class="more-toggle" onclick="toggleMoreAAs()">+${aas.length-3} more</span>`;

    feedbackText.innerHTML=`
        <b>Selected Associates:</b>
        <div class="selected-list">${aaHtml}
            ${aaExpanded && aas.length>3 ? `<span class="more-toggle" onclick="toggleMoreAAs()">Show less</span>`:""}
        </div><br>

        <b>Defect Summary</b><br>
        Total Defects: ${rows.length}<br>
        Primary Defect Driver: ${topMissed[0]?.[0]||"N/A"}<br><br>

        <b>Top Missed Attributes</b>
        ${topMissed.map((t,i)=>`
            <div class="attr-block">
                <div class="attr-header" onclick="toggleAttr(${i})">
                    <span>${t[0]} (${t[1]})</span>
                    <span class="toggle-icon" id="icon${i}">+</span>
                </div>
                <div class="attr-body" id="attr${i}">
                    <ul class="asin-list">
                        ${(asinMap[t[0]]||[]).map(o=>`
                            <li>
                                <b>${o.asin}</b>
                                ${o.retail?` – <a href="${o.retail}" target="_blank">Retail Page</a>`:""}
                                ${o.aa ? ` – <span class="aa-login">AA: ${o.aa}</span>` : ""}
                                ${o.reason?` – <b>Auditor Response </b><span class="reason-text">${o.reason}</span>`:""}
                                ${o.images.length?`
                                    <div><b>Images:</b>
                                        <ul class="image-row">
                                            ${o.images.map(i=>`<li><a href="${i}" target="_blank">View Image</a></li>`).join("")}
                                        </ul>
                                    </div>`:""}
                            </li>
                        `).join("")}
                    </ul>
                </div>
            </div>
        `).join("")}
    `;

    drawMissedChart(topMissed);
    drawDateChart(dateCount);
renderAATable(rows);


    topCategories.innerHTML=Object.entries(catCount)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,3)
        .map(c=>`• ${c[0]} (${c[1]})`)
        .join("<br>");
}

/* Charts */
function toggleAttr(i){
    const b=document.getElementById("attr"+i);
    const ic=document.getElementById("icon"+i);
    b.style.display=b.style.display==="block"?"none":"block";
    ic.innerText=b.style.display==="block"?"−":"+";
}
function drawMissedChart(a){
    if(missedChart)missedChart.destroy();
    missedChart=new Chart(document.getElementById("missedChart"),{
        type:"pie",
        data:{labels:a.map(x=>x[0]),datasets:[{data:a.map(x=>x[1])}]}
    });
}
function drawDateChart(o){
    if(dateChart)dateChart.destroy();
    const l=Object.keys(o).sort();
    dateChart=new Chart(document.getElementById("dateChart"),{
        type:"line",
        data:{labels:l,datasets:[{label:"DoD Defect Count",data:l.map(x=>o[x]),fill:true}]}
    });
}
function renderAATable(rows){
    const aaCount={};
    rows.forEach(r=>{
        aaCount[r[COL_AA]]=(aaCount[r[COL_AA]]||0)+1;
    });

    document.getElementById("aaTableContainer").innerHTML=`
        <b>Associate-wise Defects</b>
        <table class="aa-table">
            <thead>
                <tr>
                    <th>Associate</th>
                    <th>Total Defects</th>
                </tr>
            </thead>
            <tbody>
                ${Object.entries(aaCount)
                    .sort((a,b)=>b[1]-a[1])
                    .map(([aa,c])=>`
                        <tr>
                            <td>${aa}</td>
                            <td><b>${c}</b></td>
                        </tr>
                    `).join("")}
            </tbody>
        </table>
    `;
}
function sendMail(){

    // Get top 3 incorrect attributes from the dashboard data
    const topAttrs = Object.entries(
        [...document.querySelectorAll(".attr-header span:first-child")]
            .slice(0,3)
            .reduce((acc, el) => {
                const txt = el.innerText;
                const name = txt.substring(0, txt.lastIndexOf("(")).trim();
                acc[name] = true;
                return acc;
            }, {})
    ).map(x => x[0]);

    const mailBody = `Hi,

I am writing to discuss the observations from the recent quality review, with specific focus on controllable defects identified during the evaluated period.

Based on the analysis of your defect data, the majority of defects are driven by recurring incorrect attributes, indicating gaps in consistency and adherence to established quality standards. The most frequently observed incorrect attributes include:

${topAttrs.map(a => `- ${a}`).join("\n")}

Despite ongoing support, guidance, and clarifications, there has been no sustained improvement trend, which is a concern. As these defects are largely controllable, improvement is expected through better review rigor and consistent application of process guidelines.

Feedback:
- Defects are primarily driven by repeat errors rather than new or complex scenarios.
- Existing guidance and SOPs are not being applied consistently.
- Stronger attribute-level validation is required prior to submission.

Action Items:
1. Review the top incorrect attributes and revisit the corresponding SOPs and training material.
2. Apply enhanced self-audit checks focused on these attributes before submission.
3. Track recurring errors daily and implement corrective actions immediately.
4. Demonstrate measurable improvement in upcoming review cycles.

Please treat this feedback with priority. Continued recurrence of the same controllable defects may lead to further escalation.

If you need any clarification or additional support, feel free to reach out.

Regards,
`;

    window.location.href =
        `mailto:?subject=${encodeURIComponent(
            "Quality Performance Review – Controllable Defects and Improvement Actions"
        )}&body=${encodeURIComponent(mailBody)}`;
}

let latestRows = []; // store filtered rows globally

function downloadCSV(){
    if(!exportTopAttributeData.length){
        alert("No data to download");
        return;
    }

    const MAX_IMAGES = 10;

    const headers = [
        "Incorrect Attribute",
        "ASIN",
        "AA Login",
        "Auditor Reason",
        "Retail Page",
        ...Array.from({length: MAX_IMAGES}, (_,i)=>`Image ${i+1}`)
    ];

    const csvRows = [];
    csvRows.push(headers.join(","));

    exportTopAttributeData.forEach(r=>{
        const row = [
            `"${r.attribute || ""}"`,
            `"${r.asin || ""}"`,
            `"${r.aa || ""}"`,
            `"${r.reason || ""}"`,
            `"${r.retail || ""}"`,
            ...Array.from({length: MAX_IMAGES}, (_,i)=>`"${r.images[i] || ""}"`)
        ];
        csvRows.push(row.join(","));
    });

    const blob = new Blob([csvRows.join("\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "Top_Incorrect_Attributes.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
function rSafe(v){
    return (v || "").toString().replace(/"/g,'""');
}

/* Dropdown close */
managerBtn.onclick=()=>managerList.style.display=managerList.style.display==="block"?"none":"block";
dropdownBtn.onclick=()=>associateList.style.display=associateList.style.display==="block"?"none":"block";
dateBtn.onclick=()=>dateList.style.display=dateList.style.display==="block"?"none":"block";
document.addEventListener("click",e=>{
    if(!managerBox.contains(e.target)) managerList.style.display="none";
    if(!dropdownBox.contains(e.target)) associateList.style.display="none";
    if(!dateBox.contains(e.target)) dateList.style.display="none";
});

packageBtn.onclick = () =>
    packageList.style.display =
        packageList.style.display === "block" ? "none" : "block";

document.addEventListener("click", e => {
    if(!packageBox.contains(e.target))
        packageList.style.display = "none";
});

function goToDetailsPage(){
    window.location.href = "defects.html";
}
</script>

</body>
</html>
