<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AA Defect Insight & Feedback Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:linear-gradient(135deg,#1f4037,#99f2c8);
    min-height:100vh;
    padding:40px 20px;
}
h2{color:#fff;text-align:center;margin-bottom:30px;}

.card{
    background:#fff;
    max-width:1300px;
    margin:0 auto 30px;
    padding:35px 45px;
    border-radius:22px;
    box-shadow:0 18px 45px rgba(0,0,0,.28);
}

/* Controls */
.control-row{
    display:flex;
    gap:30px;
    align-items:flex-start;
    flex-wrap:wrap;
}
.hidden-file{display:none;}
.file-btn{
    padding:14px 30px;
    border-radius:35px;
    color:#fff;
    font-weight:600;
    cursor:pointer;
    background:linear-gradient(135deg,#43cea2,#185a9d);
}
.file-name{font-size:13px;color:#555;margin-top:12px;margin-left:10px}

/* Dropdown */
.dropdown{position:relative;}
.dropdown-btn{
    padding:14px 22px;
    border-radius:30px;
    border:1px solid #ccc;
    background:#fff;
    cursor:pointer;
    min-width:260px;
}
.dropdown-content{
    display:none;
    position:absolute;
    top:110%;
    left:0;
    background:#fff;
    border:1px solid #ccc;
    border-radius:16px;
    padding:12px;
    max-height:220px;
    overflow-y:auto;
    width:100%;
    z-index:100;
}
.dropdown-content label{
    display:block;
    margin-bottom:6px;
    cursor:pointer;
}

/* Layout */
.analysis-grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:30px;
}
.charts-column{
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* Feedback */
.feedback{
    background:linear-gradient(135deg,#f8fbff,#eef4ff);
    padding:26px;
    border-radius:18px;
    line-height:1.8;
    font-size:15px;
    word-break:break-word;
    overflow-wrap:anywhere;
}

/* Selected chips */
.selected-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
}
.selected-chip{
    background:#e8f0ff;
    border:1px solid #cfdcff;
    padding:4px 10px;
    border-radius:14px;
    font-size:12px;
    color:#0b5cad;
    white-space:nowrap;
}
.more-toggle{
    cursor:pointer;
    color:#185a9d;
    font-size:12px;
    font-weight:600;
}
.more-toggle:hover{text-decoration:underline;}

/* Attribute blocks */
.attr-block{
    border:1px solid #ddd;
    border-radius:14px;
    margin-top:14px;
}
.attr-header{
    padding:12px 16px;
    font-weight:600;
    color:#0b5cad;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.toggle-icon{
    font-size:20px;
    font-weight:bold;
    color:#185a9d;
}
.attr-body{
    display:none;
    padding:14px 16px;
    font-size:14px;
}

.asin-list{padding-left:18px;}
.asin-list li{
    font-size:13px;
    margin-bottom:12px;
    word-break:break-word;
    overflow-wrap:anywhere;
}

.reason-text{
    display:inline-block;
    max-width:100%;
    word-break:break-word;
    overflow-wrap:anywhere;
font-weight:700;
    font-size:12px;

}

/* Images */
.image-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:6px;
}
.image-row,
.image-row *{list-style:none!important;}
.image-row a{
    padding:6px 12px;
    border-radius:16px;
    background:#eef4ff;
    font-size:12px;
    text-decoration:none;
    color:#185a9d;
    border:1px solid #d6e2ff;
}

.section-title{
    margin:25px 0 10px;
    font-weight:700;
    font-size:16px;
    color:#333;
}

.bubble-btn{
    margin-top:30px;
    padding:15px 40px;
    border-radius:40px;
    border:none;
    font-weight:bold;
    font-size:15px;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(135deg,#ff6a00,#ee0979);
}

@media(max-width:900px){
    .analysis-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<h2>AA Defect Insight & Feedback Dashboard</h2>

<div class="card">
    <div class="control-row">
        <div>
            <label class="file-btn" for="upload">Choose Excel File</label>
            <input id="upload" type="file" accept=".xlsx,.xls" class="hidden-file">
            <div id="fileName" class="file-name">No file selected</div>
        </div>

        <div class="dropdown" id="managerBox" style="display:none">
            <div class="dropdown-btn" id="managerBtn">Select Manager</div>
            <div class="dropdown-content" id="managerList"></div>
        </div>

        <div class="dropdown" id="dropdownBox" style="display:none">
            <div class="dropdown-btn" id="dropdownBtn">Select Associates</div>
            <div class="dropdown-content" id="associateList"></div>
        </div>

        <div class="dropdown" id="dateBox" style="display:none">
            <div class="dropdown-btn" id="dateBtn">Select Dates</div>
            <div class="dropdown-content" id="dateList"></div>
        </div>
    </div>
</div>

<div class="card" id="chartSection" style="display:none">
    <div class="analysis-grid">
        <div class="charts-column">
            <canvas id="missedChart"></canvas>
            <canvas id="dateChart"></canvas>
        </div>
        <div class="feedback" id="feedbackText"></div>
    </div>

    <div class="section-title">Top 3 Repeated Defect Categories</div>
    <div class="feedback" id="topCategories"></div>

    <button class="bubble-btn" onclick="sendMail()">Share Feedback via Email</button>
</div>

<script>
let data=[], missedChart, dateChart;
let aaExpanded=false;

const COL_MANAGER="Manager";
const COL_AA="Associate 1";
const COL_INCORRECT="Incorrect";
const COL_DATE="Job Review Date";
const COL_CATEGORY="Auditor Reason Code";
const COL_ASIN="ASIN";
const COL_RETAIL="Retail Page URL";
const COL_HTML="HTML CODE";

/* Helpers */
function parseExcelDate(v){
    if(!v) return null;
    if(typeof v==="number") return new Date((v-25569)*86400*1000);
    const d=new Date(v); return isNaN(d)?null:d;
}
function formatDate(d){return d.toISOString().split("T")[0];}
function extractImageUrlsFromHtml(h){
    if(!h) return [];
    const tags=h.toString().match(/<img[^>]+src=["']([^"']+)["']/gi);
    return tags?tags.map(t=>t.match(/src=["']([^"']+)["']/i)[1]):[];
}

/* Dropdown helpers */
function handleAllToggle(box){
    const all=box.querySelector('input[value="ALL"]');
    [...box.querySelectorAll('input:not([value="ALL"])')].forEach(o=>o.checked=all.checked);
}
function syncAllFromChildren(box){
    const all=box.querySelector('input[value="ALL"]');
    const others=[...box.querySelectorAll('input:not([value="ALL"])')];
    all.checked=others.length && others.every(o=>o.checked);
}
function getSelected(box){
    return [...box.querySelectorAll('input:checked')].map(i=>i.value).filter(v=>v!=="ALL");
}
function updateText(btn,box,label){
    const c=getSelected(box).length;
    btn.innerText=c?`${c} Selected`:`Select ${label}`;
}

/* Upload */
upload.onchange=e=>{
    fileName.innerText=e.target.files[0]?.name||"No file selected";
    const r=new FileReader();
    r.onload=ev=>{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        loadManagers(); loadAssociates(); loadDates();
    };
    r.readAsArrayBuffer(e.target.files[0]);
};

/* Managers */
function loadManagers(){
    managerBox.style.display="block";
    managerList.innerHTML=`<label><input type="checkbox" value="ALL"> <b>All Managers</b></label>`;
    [...new Set(data.map(d=>d[COL_MANAGER]).filter(Boolean))].forEach(m=>{
        managerList.innerHTML+=`<label><input type="checkbox" value="${m}"> ${m}</label>`;
    });
    managerList.querySelectorAll("input").forEach(cb=>{
        cb.onchange=e=>{
            e.target.value==="ALL"?handleAllToggle(managerList):syncAllFromChildren(managerList);
            updateText(managerBtn,managerList,"Manager");
            loadAssociates(); analyse();
        };
    });
}

/* Associates */
function loadAssociates(){
    dropdownBox.style.display="block";
    associateList.innerHTML=`<label><input type="checkbox" value="ALL"> <b>All Associates</b></label>`;
    const mgrs=getSelected(managerList);
    const filtered=mgrs.length?data.filter(d=>mgrs.includes(d[COL_MANAGER])):data;
    [...new Set(filtered.map(d=>d[COL_AA]).filter(Boolean))].forEach(a=>{
        associateList.innerHTML+=`<label><input type="checkbox" value="${a}"> ${a}</label>`;
    });
    associateList.querySelectorAll("input").forEach(cb=>{
        cb.onchange=e=>{
            e.target.value==="ALL"?handleAllToggle(associateList):syncAllFromChildren(associateList);
            updateText(dropdownBtn,associateList,"Associates");
            aaExpanded=false;
            analyse();
        };
    });
}

/* Dates */
function loadDates(){
    dateBox.style.display="block";
    dateList.innerHTML=`<label><input type="checkbox" value="ALL"> <b>All Dates</b></label>`;
    [...new Set(data.map(d=>parseExcelDate(d[COL_DATE])).filter(Boolean).map(formatDate))].sort()
        .forEach(dt=>{
            dateList.innerHTML+=`<label><input type="checkbox" value="${dt}"> ${dt}</label>`;
        });
    dateList.querySelectorAll("input").forEach(cb=>{
        cb.onchange=e=>{
            e.target.value==="ALL"?handleAllToggle(dateList):syncAllFromChildren(dateList);
            updateText(dateBtn,dateList,"Dates");
            analyse();
        };
    });
}

/* Toggle selected AAs */
function toggleMoreAAs(){
    aaExpanded=!aaExpanded;
    analyse();
}

/* Analyse */
function analyse(){
    const aas=getSelected(associateList);
    const dates=getSelected(dateList);
    if(!aas.length) return;

    const rows=data.filter(d=>{
        if(!aas.includes(d[COL_AA])) return false;
        if(dates.length){
            const dt=parseExcelDate(d[COL_DATE]);
            if(!dt||!dates.includes(formatDate(dt))) return false;
        }
        return true;
    });

    chartSection.style.display="block";

    let attrMap={}, asinMap={}, dateCount={}, catCount={};

    rows.forEach(r=>{
        if(r[COL_INCORRECT]){
            r[COL_INCORRECT].split(",").forEach(a=>{
                a=a.trim();
                attrMap[a]=(attrMap[a]||0)+1;
                asinMap[a]=asinMap[a]||[];
                asinMap[a].push({
                    asin:r[COL_ASIN],
                    retail:r[COL_RETAIL],
                    reason:r[COL_CATEGORY],
                    images:extractImageUrlsFromHtml(r[COL_HTML])
                });
            });
        }
        if(r[COL_CATEGORY]) catCount[r[COL_CATEGORY]]=(catCount[r[COL_CATEGORY]]||0)+1;
        const d=parseExcelDate(r[COL_DATE]);
        if(d){const k=formatDate(d);dateCount[k]=(dateCount[k]||0)+1;}
    });

    const topMissed=Object.entries(attrMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

    /* Selected Associates UI */
    const aaHtml = aaExpanded || aas.length<=3
        ? aas.map(a=>`<span class="selected-chip">${a}</span>`).join("")
        : aas.slice(0,3).map(a=>`<span class="selected-chip">${a}</span>`).join("")
          + `<span class="more-toggle" onclick="toggleMoreAAs()">+${aas.length-3} more</span>`;

    feedbackText.innerHTML=`
        <b>Selected Associates:</b>
        <div class="selected-list">${aaHtml}
            ${aaExpanded && aas.length>3 ? `<span class="more-toggle" onclick="toggleMoreAAs()">Show less</span>`:""}
        </div><br>

        <b>Defect Summary</b><br>
        Total Defects: ${rows.length}<br>
        Primary Defect Driver: ${topMissed[0]?.[0]||"N/A"}<br><br>

        <b>Top Missed Attributes</b>
        ${topMissed.map((t,i)=>`
            <div class="attr-block">
                <div class="attr-header" onclick="toggleAttr(${i})">
                    <span>${t[0]} (${t[1]})</span>
                    <span class="toggle-icon" id="icon${i}">+</span>
                </div>
                <div class="attr-body" id="attr${i}">
                    <ul class="asin-list">
                        ${(asinMap[t[0]]||[]).map(o=>`
                            <li>
                                <b>${o.asin}</b>
                                ${o.retail?` – <a href="${o.retail}" target="_blank">Retail Page</a>`:""}
                                ${o.reason?` – <span class="reason-text">${o.reason}</span>`:""}
                                ${o.images.length?`
                                    <div><b>Images:</b>
                                        <ul class="image-row">
                                            ${o.images.map(i=>`<li><a href="${i}" target="_blank">View Image</a></li>`).join("")}
                                        </ul>
                                    </div>`:""}
                            </li>
                        `).join("")}
                    </ul>
                </div>
            </div>
        `).join("")}
    `;

    drawMissedChart(topMissed);
    drawDateChart(dateCount);

    topCategories.innerHTML=Object.entries(catCount)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,3)
        .map(c=>`• ${c[0]} (${c[1]})`)
        .join("<br>");
}

/* Charts */
function toggleAttr(i){
    const b=document.getElementById("attr"+i);
    const ic=document.getElementById("icon"+i);
    b.style.display=b.style.display==="block"?"none":"block";
    ic.innerText=b.style.display==="block"?"−":"+";
}
function drawMissedChart(a){
    if(missedChart)missedChart.destroy();
    missedChart=new Chart(document.getElementById("missedChart"),{
        type:"pie",
        data:{labels:a.map(x=>x[0]),datasets:[{data:a.map(x=>x[1])}]}
    });
}
function drawDateChart(o){
    if(dateChart)dateChart.destroy();
    const l=Object.keys(o).sort();
    dateChart=new Chart(document.getElementById("dateChart"),{
        type:"line",
        data:{labels:l,datasets:[{label:"DoD Defect Count",data:l.map(x=>o[x]),fill:true}]}
    });
}
function sendMail(){

    // attributes
    const topAttrs = Object.entries(
        [...document.querySelectorAll(".attr-header span:first-child")]
            .slice(0,3)
            .reduce((acc, el) => {
                const txt = el.innerText;
                const name = txt.substring(0, txt.lastIndexOf("(")).trim();
                acc[name] = true;
                return acc;
            }, {})
    ).map(x => x[0]);

    const mailBody = `Hi,

I am writing to discuss the observations from the recent quality review, with specific focus on controllable defects identified during the evaluated period.

Based on the analysis of your defect data, the majority of defects are driven by recurring incorrect attributes, indicating gaps in consistency and adherence to established quality standards. The most frequently observed incorrect attributes include:

${topAttrs.map(a => `- ${a}`).join("\n")}

Despite ongoing support, guidance, and clarifications, there has been no sustained improvement trend, which is a concern. As these defects are largely controllable, improvement is expected through better review rigor and consistent application of process guidelines.

Feedback:
- Defects are primarily driven by repeat errors rather than new or complex scenarios.
- Existing guidance and SOPs are not being applied consistently.
- Stronger attribute-level validation is required prior to submission.

Action Items:
1. Review the top incorrect attributes and revisit the corresponding SOPs and training material.
2. Apply enhanced self-audit checks focused on these attributes before submission.
3. Track recurring errors daily and implement corrective actions immediately.
4. Demonstrate measurable improvement in upcoming review cycles.

Please treat this feedback with priority. Continued recurrence of the same controllable defects may lead to further escalation.

If you need any clarification or additional support, feel free to reach out.

Regards,
`;

    window.location.href =
        `mailto:?subject=${encodeURIComponent(
            "Quality Performance Review – Controllable Defects and Improvement Actions"
        )}&body=${encodeURIComponent(mailBody)}`;
}

/* Dropdown close */
managerBtn.onclick=()=>managerList.style.display=managerList.style.display==="block"?"none":"block";
dropdownBtn.onclick=()=>associateList.style.display=associateList.style.display==="block"?"none":"block";
dateBtn.onclick=()=>dateList.style.display=dateList.style.display==="block"?"none":"block";
document.addEventListener("click",e=>{
    if(!managerBox.contains(e.target)) managerList.style.display="none";
    if(!dropdownBox.contains(e.target)) associateList.style.display="none";
    if(!dateBox.contains(e.target)) dateList.style.display="none";
});
</script>

</body>
</html>
