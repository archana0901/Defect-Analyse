<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AA-wise Defect Details</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at top left,#c7d2fe,transparent 40%),
        radial-gradient(circle at bottom right,#99f6e4,transparent 40%),
        linear-gradient(180deg,#eef2ff,#f8fafc);
    min-height:100vh;
    padding:30px;
    color:#0f172a;
    overflow-x:hidden;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.back-btn{
    padding:10px 18px;
    border-radius:999px;
    border:none;
    background:linear-gradient(135deg,#6366f1,#22d3ee);
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.filter-bar{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(12px);
    padding:18px 22px;
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
    margin-bottom:30px;
}

.filter-group,.dropdown{
    display:flex;
    flex-direction:column;
    gap:8px;
    position:relative;
}

.dropdown-btn{
    height:40px;
    display:flex;
    align-items:center;
    padding:0 18px;
    border-radius:999px;
    border:1px solid #c7d2fe;
    background:#fff;
    cursor:pointer;
    font-weight:600;
    min-width:220px;
}

.dropdown-content{
    display:none;
    position:absolute;
    top:65px;
    background:#fff;
    max-height:250px;
    overflow-y:auto;
    border-radius:14px;
    padding:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    z-index:50;
    width:220px;
}

.dropdown-content label{
    display:block;
    margin-bottom:6px;
}

.upload-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:12px 20px;
    border-radius:999px;
    background:linear-gradient(135deg,#6366f1,#22d3ee);
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

#fileName{
    font-size:13px;
    margin-top:8px;
    max-width:220px;
    word-break:break-word;

}

.review-toggle-container{
    margin-bottom:20px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
}

.review-btn{
    padding:10px 20px;
    border-radius:999px;
    border:none;
    font-weight:700;
    cursor:pointer;
    color:#fff;
}

.unreviewed-btn{background:linear-gradient(135deg,#f97316,#ec4899);}
.reviewed-btn{background:linear-gradient(135deg,#16a34a,#22c55e);}
.disputed-btn{background:linear-gradient(135deg,#dc2626,#ef4444);}

.defect-list{
    display:flex;
    flex-direction:column;
    gap:18px;

}

.defect-item{
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 12px 28px rgba(0,0,0,.12);
    overflow: hidden;
    word-break:break-word;
    font-size:12px;
}

.reviewed-card{
    background:linear-gradient(135deg,#dcfce7,#bbf7d0);
    border:1px solid #22c55e;
}

.disputed-badge{
    background:#ef4444;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.reviewed-badge{
    background:#22c55e;
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.mark-btn{
    background:#6366f1;
    color:#fff;
    border:none;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.image-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

.image-grid img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #e5e7eb;
    cursor:pointer;
}

.disputed-card{
    background:linear-gradient(135deg,#fef9c3,#fde68a);
    border:1px solid #facc15;
}

</style>
</head>

<body>

<div class="header">
<h1>AA-wise Defect Details</h1>
<button class="back-btn" onclick="history.back()">← Back</button>
</div>

<div class="filter-bar">

<div class="filter-group">
<label>Upload Excel</label>
<label class="upload-btn">
📊 Choose Excel File
<input type="file" id="upload" hidden>
</label>
<div id="fileName">No file selected</div>
</div>

<div class="dropdown">
<label>Managers</label>
<div class="dropdown-btn" id="managerBtn">Select Managers</div>
<div class="dropdown-content" id="managerList"></div>
</div>

<div class="dropdown">
<label>Associates</label>
<div class="dropdown-btn" id="associateBtn">Select Associates</div>
<div class="dropdown-content" id="associateList"></div>
</div>

<div class="dropdown">
<label>Job Review Date</label>
<div class="dropdown-btn" id="dateBtn">Select Dates</div>
<div class="dropdown-content" id="dateList"></div>
</div>

</div>

<div class="review-toggle-container">
<button id="toggleUnreviewedBtn" class="review-btn unreviewed-btn">Show Only Unreviewed</button>
<button id="toggleReviewedBtn" class="review-btn reviewed-btn">Show Only Reviewed</button>
<button id="toggleDisputedBtn" class="review-btn disputed-btn">Show Only Disputed</button>
</div>

<div id="defectContainer" class="defect-list"></div>

<script>
const COL_MANAGER="Manager";
const COL_AA="Associate 1";
const COL_DATE="Job Review Date";
const COL_ASIN="ASIN";
const COL_HTML="HTML CODE";
const COL_RETAIL="Retail Page URL";
const COL_INCORRECT="Incorrect";
const COL_MISSED="Missed";
const COL_REASON="Auditor Reason Code";

let defectRows=[];
let showOnlyUnreviewed=false;
let showOnlyReviewed=false;
let showOnlyDisputed=false;

let reviewedDefects=JSON.parse(localStorage.getItem("reviewedDefects")||"{}");
let disputedDefects=JSON.parse(localStorage.getItem("disputedDefects")||"{}");

function saveData(){
localStorage.setItem("reviewedDefects",JSON.stringify(reviewedDefects));
localStorage.setItem("disputedDefects",JSON.stringify(disputedDefects));
}

function getKey(asin,aa){return aa+"__"+asin;}

const upload=document.getElementById("upload");
const managerList=document.getElementById("managerList");
const associateList=document.getElementById("associateList");
const dateList=document.getElementById("dateList");
const managerBtn=document.getElementById("managerBtn");
const associateBtn=document.getElementById("associateBtn");
const dateBtn=document.getElementById("dateBtn");
const defectContainer=document.getElementById("defectContainer");

upload.onchange=e=>{
document.getElementById("fileName").innerText=upload.files[0]?.name||"No file selected";
const reader=new FileReader();
reader.onload=ev=>{
const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
defectRows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
loadManagers();
loadAssociates();
loadDates();
applyFilter();
};
reader.readAsArrayBuffer(e.target.files[0]);
};

function toggle(btn,list){
btn.onclick=e=>{
e.stopPropagation();
list.style.display=list.style.display==="block"?"none":"block";
};
}
toggle(managerBtn,managerList);
toggle(associateBtn,associateList);
toggle(dateBtn,dateList);

document.addEventListener("click",()=>{
managerList.style.display="none";
associateList.style.display="none";
dateList.style.display="none";
});

function excelDate(serial){
if(typeof serial==="number"){
const utc_days=Math.floor(serial-25569);
return new Date(utc_days*86400*1000).toISOString().split("T")[0];
}
return serial;
}

function addSelectAll(container){
const selectAll=document.createElement("label");
selectAll.innerHTML=`<input type="checkbox" value="__ALL__"> <b>Select All</b>`;
container.prepend(selectAll);

selectAll.querySelector("input").onchange=function(){
container.querySelectorAll("input:not([value='__ALL__'])")
.forEach(cb=>cb.checked=this.checked);
updateButton(container);
applyFilter();
};
}

function getSelected(container){
return [...container.querySelectorAll("input:checked")]
.map(i=>i.value).filter(v=>v!=="__ALL__");
}

function updateButton(container){
let btn;
if(container===managerList) btn=managerBtn;
if(container===associateList) btn=associateBtn;
if(container===dateList) btn=dateBtn;

const selected=getSelected(container);
if(!selected.length) btn.innerText="Select";
else if(selected.length<=2) btn.innerText=selected.join(", ");
else btn.innerText=selected.length+" Selected";
}

function loadManagers(){
managerList.innerHTML="";
[...new Set(defectRows.map(r=>r[COL_MANAGER]).filter(Boolean))]
.forEach(m=>managerList.innerHTML+=`<label><input type="checkbox" value="${m}"> ${m}</label>`);
addSelectAll(managerList);
managerList.querySelectorAll("input").forEach(cb=>cb.onchange=()=>{updateButton(managerList);loadAssociates();applyFilter();});
}

function loadAssociates(){
associateList.innerHTML="";
const mgr=getSelected(managerList);
let rows=mgr.length?defectRows.filter(r=>mgr.includes(r[COL_MANAGER])):defectRows;
[...new Set(rows.map(r=>r[COL_AA]).filter(Boolean))]
.forEach(a=>associateList.innerHTML+=`<label><input type="checkbox" value="${a}"> ${a}</label>`);
addSelectAll(associateList);
associateList.querySelectorAll("input").forEach(cb=>cb.onchange=()=>{updateButton(associateList);applyFilter();});
}

function loadDates(){
dateList.innerHTML="";
[...new Set(defectRows.map(r=>excelDate(r[COL_DATE])).filter(Boolean))]
.forEach(d=>dateList.innerHTML+=`<label><input type="checkbox" value="${d}"> ${d}</label>`);
addSelectAll(dateList);
dateList.querySelectorAll("input").forEach(cb=>cb.onchange=()=>{updateButton(dateList);applyFilter();});
}

function applyFilter(){
let rows=[...defectRows];
const mgr=getSelected(managerList);
const aa=getSelected(associateList);
const dt=getSelected(dateList);

if(mgr.length) rows=rows.filter(r=>mgr.includes(r[COL_MANAGER]));
if(aa.length) rows=rows.filter(r=>aa.includes(r[COL_AA]));
if(dt.length) rows=rows.filter(r=>dt.includes(excelDate(r[COL_DATE])));

if(showOnlyUnreviewed) rows=rows.filter(r=>!reviewedDefects[getKey(r[COL_ASIN],r[COL_AA])]);
if(showOnlyReviewed) rows=rows.filter(r=>reviewedDefects[getKey(r[COL_ASIN],r[COL_AA])]);
if(showOnlyDisputed) rows=rows.filter(r=>disputedDefects[getKey(r[COL_ASIN],r[COL_AA])]);

renderDefects(rows);
}

document.getElementById("toggleUnreviewedBtn").onclick=function(){
showOnlyUnreviewed=!showOnlyUnreviewed;
showOnlyReviewed=false;showOnlyDisputed=false;applyFilter();};

document.getElementById("toggleReviewedBtn").onclick=function(){
showOnlyReviewed=!showOnlyReviewed;
showOnlyUnreviewed=false;showOnlyDisputed=false;applyFilter();};

document.getElementById("toggleDisputedBtn").onclick=function(){
showOnlyDisputed=!showOnlyDisputed;
showOnlyUnreviewed=false;showOnlyReviewed=false;applyFilter();};

function markReviewed(asin,aa){
const key=getKey(asin,aa);
reviewedDefects[key]?delete reviewedDefects[key]:reviewedDefects[key]=true;
saveData();applyFilter();
}

function markDisputed(asin,aa){
const key=getKey(asin,aa);
disputedDefects[key]?delete disputedDefects[key]:disputedDefects[key]=true;
saveData();applyFilter();
}

function extractImages(html){
if(!html) return [];
const matches=html.match(/<img[^>]+src=["']([^"']+)["']/gi);
return matches?matches.map(x=>x.match(/src=["']([^"']+)["']/i)[1]):[];
}

function extractDispute(html){
const m=html?.match(/https:\/\/share\.amazon\.com\/[^\s"'<>]+/i);
return m?m[0]:null;
}

function renderDefects(rows){
if(!rows.length){defectContainer.innerHTML="<div>No defects found</div>";return;}
defectContainer.innerHTML=rows.map(r=>{
const key=getKey(r[COL_ASIN],r[COL_AA]);
const isReviewed=reviewedDefects[key];
const isDisputed=disputedDefects[key];
const images=extractImages(r[COL_HTML]);
const dispute=extractDispute(r[COL_HTML]);

return `
<div class="defect-item 
${isDisputed ? 'disputed-card' : isReviewed ? 'reviewed-card' : ''}">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

<div style="font-weight:700;">
${r[COL_ASIN] || ""}
</div>

<div style="display:flex;gap:8px;">

${isReviewed
? `<span class="reviewed-badge"
    onclick="markReviewed('${r[COL_ASIN]}','${r[COL_AA]}')">
    Reviewed
   </span>`
: `<button class="mark-btn"
    onclick="markReviewed('${r[COL_ASIN]}','${r[COL_AA]}')">
    Mark Reviewed
   </button>`
}

${isDisputed
? `<span class="disputed-badge"
    onclick="markDisputed('${r[COL_ASIN]}','${r[COL_AA]}')">
    Disputed
   </span>`
: `<button class="mark-btn"
    style="background:#ef4444;"
    onclick="markDisputed('${r[COL_ASIN]}','${r[COL_AA]}')">
    Mark Disputable
   </button>`
}

</div>
</div>


<b>Manager:</b> ${r[COL_MANAGER]||"N/A"}<br>
<b>Associate:</b> ${r[COL_AA]||"N/A"}<br>
<b>Date:</b> ${excelDate(r[COL_DATE])||"N/A"}<br>
<b>Incorrect:</b> ${r[COL_INCORRECT]||"N/A"}<br>
<b>Missed:</b> ${r[COL_MISSED]||"N/A"}<br>
<b>Reason:</b> ${r[COL_REASON]||"N/A"}<br>

${r[COL_RETAIL]?`<a href="${r[COL_RETAIL]}" target="_blank"><b>Retail ↗</b></a>`:""}
${dispute?` | <a href="${dispute}" target="_blank" style="color:red;font-weight:bold;">Dispute ↗</a>`:""}

${images.length?`
<div class="image-grid">
${images.map(i=>`<img src="${i}" onclick="window.open('${i}')">`).join("")}
</div>`:""}
</div>
`;
}).join("");
}
function goHome(){
    window.location.href = "index.html";  
}
</script>
</body>
</html>
