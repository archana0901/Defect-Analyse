<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AA-wise Defect Details</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ========== GLOBAL ========== */
body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at top left,#c7d2fe,transparent 40%),
        radial-gradient(circle at bottom right,#99f6e4,transparent 40%),
        linear-gradient(180deg,#eef2ff,#f8fafc);
    min-height:100vh;
    padding:30px;
    color:#0f172a;
}

/* ========== HEADER ========== */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}
.header h1{
    font-size:28px;
    font-weight:800;
}
.back-btn{
    padding:10px 18px;
    border-radius:999px;
    border:none;
    background:linear-gradient(135deg,#6366f1,#22d3ee);
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

/* ========== FILTER BAR ========== */
.filter-bar{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(12px);
    padding:18px 22px;
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
    margin-bottom:30px;
}
.filter-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}
.filter-group label{
    font-weight:700;
    font-size:14px;
}
.filter-group select{
    min-width:240px;
    padding:10px 14px;
    border-radius:14px;
    border:1px solid #c7d2fe;
    background:#fff;
    font-size:14px;
    cursor:pointer;
}

/* ========== DEFECT LIST ========== */
.defect-list{
    display:flex;
    flex-direction:column;
    gap:18px;
overflow-x: hidden;
word-break: break-word;
}
.defect-item{
    background:#fff;
    border-radius:20px;
    padding:20px 22px;
    box-shadow:0 12px 28px rgba(0,0,0,.12);
}
.defect-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;

}
.asin{
    font-weight:800;
    font-size:15px;
}
.badge{
    background:#22c55e;
    color:#fff;
    padding:4px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
}
.meta{
    font-size:13px;
    margin:6px 0;
}
.meta a{
    color:#4f46e5;
    font-weight:600;
    text-decoration:none;

}

/* ========== IMAGES ========== */
.image-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}
.image-grid img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:14px;
    border:1px solid #e5e7eb;
    cursor:pointer;
    transition:.25s;
}
.image-grid img:hover{
    transform:scale(1.05);
}

/* ========== EMPTY STATE ========== */
.empty{
    text-align:center;
    padding:60px;
    font-weight:700;
    color:#64748b;
}

.dropdown{position:relative;min-width:260px;}
.dropdown-btn{
    padding:12px 18px;
    border-radius:999px;
    border:1px solid #c7d2fe;
    background:#fff;
    cursor:pointer;
    font-weight:600;
}
.dropdown-content{
    display:none;
    position:absolute;
    top:120%;
    left:0;
    width:100%;
    max-height:240px;
    overflow-y:auto;
    background:#fff;
    border-radius:14px;
    padding:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    z-index:50;
}
.dropdown-content label{
    display:flex;
    gap:8px;
    padding:6px 4px;
    cursor:pointer;
    font-size:13px;
}

/* ===== FILTER BAR ALIGNMENT FIX ===== */
.filter-bar{
    display:flex;
    align-items:flex-start;   /* key fix */
    gap:40px;
    flex-wrap:wrap;
}

/* All groups same vertical structure */
.filter-group,
.dropdown{
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* Label alignment */
.filter-label{
    font-weight:700;
    font-size:14px;
    margin-left:6px;
}

/* Upload group height balance */
.upload-group{
    min-width:260px;
}

/* Button & dropdown same height */
.upload-btn{height:20px;
    display:flex;
    align-items:center;
    padding:0 22px;
    border-radius:999px;
    font-size:14px;
}
.dropdown-btn{
    height:40px;
    display:flex;
    align-items:center;
    padding:0 22px;
    border-radius:999px;
    font-size:14px;
}

/* Dropdown button width */
.dropdown-btn{
    min-width:260px;
}

/* File name spacing */
.file-name{
    font-size:12px;
    color:#64748b;
    margin-left:10px;
}

.dropdown-content label{
    display:flex;
    gap:10px;
    padding:8px 6px;
    cursor:pointer;
}

/* ===== UPLOAD BUTTON ===== */
.upload-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.upload-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 22px;
    border-radius:999px;
    background:linear-gradient(135deg,#6366f1,#22d3ee);
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 12px 30px rgba(99,102,241,.35);
    transition:all .25s ease;
    width:max-content;
}

.upload-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 36px rgba(99,102,241,.45);
}

.upload-btn:active{
    transform:scale(.97);
}

.file-name{
    font-size:12px;
    color:#475569;
    margin-left:10px;
}

</style>
</head>

<body>

<div class="header">
    <h1>AA-wise Defect Details</h1>
    <button class="back-btn" onclick="goBack()">← Back</button>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
<div class="filter-group upload-group">
    <label class="filter-label">Upload Excel</label>

    <label class="upload-btn">
        📊 Choose Excel File
        <input type="file" id="upload" accept=".xlsx,.xls" hidden>
    </label>

    <div class="file-name" id="fileName">No file selected</div>
</div>


    <div class="dropdown" id="managerBox">
        <label class="filter-label">Managers</label>
        <div class="dropdown-btn" id="managerBtn">Select Managers</div>
        <div class="dropdown-content" id="managerList"></div>
    </div>

   <div class="dropdown" id="associateBox">
<label class="filter-label">Associates</label>
        <div class="dropdown-btn" id="associateBtn">Select Associates</div>
        <div class="dropdown-content" id="associateList"></div>
    </div>
</div>

<!-- DEFECT LIST -->
<div id="defectContainer" class="defect-list"></div>
<script>
/* ===== COLUMN NAMES ===== */
const COL_MANAGER = "Manager";
const COL_AA = "Associate 1";
const COL_INCORRECT = "Incorrect";
const COL_MISSED = "Missed";
const COL_REASON = "Auditor Reason Code";
const COL_RETAIL = "Retail Page URL";
const COL_HTML = "HTML CODE";
const COL_ASIN = "ASIN";

/* ===== DOM ===== */
const upload = document.getElementById("upload");
const managerList = document.getElementById("managerList");
const managerBtn = document.getElementById("managerBtn");
const managerBox = document.getElementById("managerBox");
const associateList = document.getElementById("associateList");
const associateBtn = document.getElementById("associateBtn");
const associateBox = document.getElementById("associateBox");
const defectContainer = document.getElementById("defectContainer");

/* ===== DATA ===== */
let defectRows = [];

/* ===== UPLOAD EXCEL ===== */
upload.onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
        defectRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        loadManagers();
        loadAssociates();
        renderDefects(defectRows);
    };
    reader.readAsArrayBuffer(e.target.files[0]);
};

/* ===== DROPDOWN HELPERS ===== */
function handleAll(box){
    const all = box.querySelector('input[value="ALL"]');
    box.querySelectorAll('input:not([value="ALL"])')
        .forEach(i => i.checked = all.checked);
}
function getSelected(box){
    return [...box.querySelectorAll("input:checked")]
        .map(i => i.value)
        .filter(v => v !== "ALL");
}

/* ===== MANAGERS ===== */
function loadManagers(){
    managerList.innerHTML = `<label><input type="checkbox" value="ALL"> <b>All Managers</b></label>`;
    [...new Set(defectRows.map(r => r[COL_MANAGER]).filter(Boolean))]
        .forEach(m => {
            managerList.innerHTML += `<label><input type="checkbox" value="${m}"> ${m}</label>`;
        });

    managerList.querySelectorAll("input").forEach(cb => {
       cb.onchange = () => {
    if(cb.value === "ALL") handleAll(managerList);
    updateManagerText();
    loadAssociates();   
    applyFilter();
};

    });
}
function updateManagerText(){
    const c = getSelected(managerList).length;
    managerBtn.innerText = c ? `${c} Selected` : "Select Managers";
}

/* ===== ASSOCIATES ===== */
function loadAssociates(){
    associateList.innerHTML =
        `<label><input type="checkbox" value="ALL"> <b>All Associates</b></label>`;

    const selectedManagers = getSelected(managerList);

    // filter rows based on selected managers
    const filteredRows = selectedManagers.length
        ? defectRows.filter(r => selectedManagers.includes(r[COL_MANAGER]))
        : defectRows;

    [...new Set(filteredRows.map(r => r[COL_AA]).filter(Boolean))]
        .forEach(a => {
            associateList.innerHTML += `
                <label>
                    <input type="checkbox" value="${a}"> ${a}
                </label>`;
        });

    associateList.querySelectorAll("input").forEach(cb => {
        cb.onchange = () => {
            if(cb.value === "ALL") handleAll(associateList);
            updateAssociateText();
            applyFilter();
        };
    });

    updateAssociateText();
}
function updateAssociateText(){
    const c = getSelected(associateList).length;
    associateBtn.innerText = c ? `${c} Selected` : "Select Associates";
}

/* ===== EXTRACT ===== */
function extractImages(html){
    if(!html) return [];
    const m = html.match(/<img[^>]+src=["']([^"']+)["']/gi);
    return m ? m.map(x => x.match(/src=["']([^"']+)["']/i)[1]) : [];
}
function extractDispute(html){
    const m = html?.match(/https:\/\/share\.amazon\.com\/[^\s"'<>]+/i);
    return m ? m[0] : null;
}

/* ===== RENDER ===== */
function renderDefects(rows){
    if(!rows.length){
        defectContainer.innerHTML = `<div class="empty">No defects found</div>`;
        return;
    }

    defectContainer.innerHTML = rows.map(r => {
        const images = extractImages(r[COL_HTML]);
        const dispute = extractDispute(r[COL_HTML]);

        return `
        <div class="defect-item">
            <div class="defect-header">
                <div class="asin">${r[COL_ASIN] || "N/A"}</div>
                <span class="badge">${r[COL_AA]}</span>
            </div>

            <div class="meta">
                <b>Manager:</b> ${r[COL_MANAGER] || "N/A"}<br>
                <b>Incorrect:</b> ${r[COL_INCORRECT] || "N/A"}<br>
                <b>Missed:</b> ${r[COL_MISSED] || "N/A"}<br>
                <b>Reason:</b> ${r[COL_REASON] || "N/A"}<br>
                ${r[COL_RETAIL] ? `<a href="${r[COL_RETAIL]}" target="_blank">Retail Page ↗</a>` : ""}
                ${dispute ? ` | <a href="${dispute}" target="_blank" style="color:#dc2626;font-weight:700">Dispute ↗</a>` : ""}
            </div>

            ${images.length ? `
            <div class="image-grid">
                ${images.map(i => `<img src="${i}" onclick="window.open('${i}')">`).join("")}
            </div>` : ""}
        </div>`;
    }).join("");
}

/* ===== FILTER ===== */
function applyFilter(){
    let rows = [...defectRows];
    const mgrs = getSelected(managerList);
    const aas = getSelected(associateList);

    if(mgrs.length) rows = rows.filter(r => mgrs.includes(r[COL_MANAGER]));
    if(aas.length) rows = rows.filter(r => aas.includes(r[COL_AA]));

    renderDefects(rows);
}

/* ===== DROPDOWN TOGGLE ===== */
managerBtn.onclick = () =>
    managerList.style.display = managerList.style.display === "block" ? "none" : "block";
associateBtn.onclick = () =>
    associateList.style.display = associateList.style.display === "block" ? "none" : "block";

document.addEventListener("click", e => {
    if(!managerBox.contains(e.target)) managerList.style.display = "none";
    if(!associateBox.contains(e.target)) associateList.style.display = "none";
});

function goBack(){
    window.history.back();
}
</script>


</body>
</html>
